<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="204" viewBox="0 0 1280 204" role="img" aria-labelledby="title desc">
  <title id="title">Verified engineering results</title>
  <desc id="desc">420 tests passed, one known expected failure. Eight of eight static hashes match. Eight scripted offline cases. One historical two-agent model run; not a repeatability benchmark.</desc>
