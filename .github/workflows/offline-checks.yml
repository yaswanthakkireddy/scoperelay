name: Offline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SCOPERELAY_LOCAL_LIVE_AUTHORIZED: NO
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv==0.13.1
      - name: Install locked dependencies
        shell: pwsh
        run: uv sync --locked --no-python-downloads
      - name: Unit and integration tests (offline)
        shell: pwsh
        run: uv run --locked --no-python-downloads pytest -q
      - name: Compile Python sources and QA scripts
        shell: pwsh
        run: uv run --locked --no-python-downloads python -m compileall -q src tests apps/showcase scripts
      - name: Lint Python sources
        shell: pwsh
        run: uv run --locked --no-python-downloads ruff check src tests apps/showcase scripts
      - name: Check Python formatting
        shell: pwsh
        run: uv run --locked --no-python-downloads ruff format --check src tests apps/showcase scripts
      - name: Verify local documentation links
        shell: pwsh
        run: uv run --locked --no-python-downloads python scripts/check_markdown_links.py
      - name: Rebuild reviewed static artifact
        shell: pwsh
        run: uv run --locked --no-python-downloads python apps/showcase/build.py
      - name: Verify exact eight-file artifact
        shell: pwsh
        run: uv run --locked --no-python-downloads python scripts/verify_static.py
      - name: Audit locked environment dependencies
        shell: pwsh
        run: uvx --from pip-audit==2.10.1 pip-audit --path .venv/Lib/site-packages
      - name: Detect candidate secrets against reviewed baseline
        shell: pwsh
        run: |
          $files = git ls-files --cached
          uvx --from detect-secrets==1.5.0 detect-secrets-hook --baseline .secrets.baseline $files
